<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>AURELIA RESIDENCE — Private Interior Architecture & Residential Monograph</title>
  <meta name="description" content="An immersive scroll-controlled architectural monograph exploring Aurelia Residence, a world-class luxury interior architecture studio project.">
  
  <!-- Architectural Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Plus+Jakarta+Sans:wght@200;300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <script type="module" crossorigin src="/assets/index-BieyHoYY.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Ez0JxqDD.css">
</head>
<body>

  <!-- MINIMAL FIXED HEADER -->
  <header id="site-header"></header>

  <!-- MINIMAL VERTICAL PROGRESS RAIL (Screen Edge) -->
  <nav id="vertical-rail" aria-label="Chapter progress"></nav>

  <!-- CHAPTER INDEX DRAWER -->
  <div id="chapter-drawer-container"></div>

  <!-- ARCHITECTURAL JOURNEY SCROLL TRACK (Houses the Sticky Fullscreen Stage) -->
  <section class="scroll-track" id="scroll-track" aria-label="Architectural Experience">
    
    <!-- STICKY PINNED STAGE (Full Viewport Canvas) -->
    <div class="pinned-stage" id="pinned-stage">
      
      <!-- FULL-SCREEN CINEMATIC ARCHITECTURAL CANVAS (NO SIDEBAR, NO BOXED UI) -->
      <div class="cinematic-canvas" id="cinematic-canvas">
        
        <!-- Hardware-Accelerated Video Stack & Posters (Full Bleed Viewport) -->
        <div class="video-canvas-stack" id="video-canvas-stack">
          <!-- Videos injected and scrubbed via ScrubberEngine -->
        </div>

        <!-- Subtle Cinematic Lighting Vignette (Preserves natural palette while guaranteeing contrast) -->
        <div class="cinematic-vignette" id="cinematic-vignette" aria-hidden="true"></div>

        <!-- Interactive Hotspots Overlay -->
        <div class="hotspots-layer" id="hotspots-layer">
          <!-- Dynamic Hotspot Markers injected here -->
        </div>

        <!-- FLOATING EDITORIAL TYPOGRAPHY OVERLAY (Directly over the architectural footage) -->
        <div class="editorial-overlay-layer" id="editorial-overlay-layer">
          <!-- Dynamically typeset by EditorialView into negative space -->
        </div>

        <!-- MINIMAL BOTTOM HUD TELEMETRY (Subtle hairline footer strip) -->
        <div class="canvas-bottom-hud" id="canvas-bottom-hud">
          <div class="hud-left-strip">
            <span class="hud-pulse-dot"></span>
            <span class="hud-label" id="hud-camera-tag">AURELIA RESIDENCE</span>
            <span class="hud-divider">/</span>
            <span class="hud-label" id="hud-space-tag">01 / ARRIVAL</span>
            <span class="hud-divider">·</span>
            <span class="hud-telemetry" id="telemetry-elev">ELEV: +1.60m</span>
            <span class="hud-divider">·</span>
            <span class="hud-telemetry" id="telemetry-lens">LENS: 24mm</span>
            <span class="hud-divider">·</span>
            <span class="hud-telemetry" id="telemetry-orient">NE 34°</span>
          </div>

          <div class="hud-right-strip">
            <span class="hud-frame-telemetry" id="hud-frame-count">FRAME 001 // 193</span>
            <span class="hud-divider">·</span>
            <span class="hud-timecode" id="hud-timecode">TC 00:00:01:04</span>
          </div>
        </div>

        <!-- HERO / OPENING OVERLAY (Directly over the initial architectural frame, dissolves on scroll) -->
        <div class="hero-opening" id="hero-opening">
          <div class="hero-opening-content">
            <span class="mono-tag" style="margin-bottom: 1.25rem; display: inline-block;">PRIVATE RESIDENCE · EST. 2026</span>
            <h1 class="hero-title">
              AURELIA<br>
              <span>RESIDENCE</span>
            </h1>
            <div class="hero-subtitles">
              <span>PRIVATE RESIDENCE</span>
              <span>·</span>
              <span>INTERIOR ARCHITECTURE</span>
            </div>
            <div class="hero-scroll-prompt">
              <div class="scroll-indicator">
                <span>SCROLL TO ENTER</span>
                <div class="scroll-indicator-line"></div>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>

  </section>

  <!-- STUDIO, EXPERIENCE, SERVICES & CONTACT SECTIONS -->
  <div id="studio-sections-container"></div>

  <!-- MAIN SCRIPT ENTRYPOINT -->
</body>
</html>
